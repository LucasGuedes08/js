<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - Dia dos Namorados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="coracao">❤</div>

        <h1>Dia dos Namorados</h1>

        <p class="subtitulo">
            Contagem regressiva para 12 de junho de 2027
        </p>

        <div class="contador">

            <div class="tempo">
                <span id="anos">0</span>
                <p>Anos</p>
            </div>

            <div class="tempo">
                <span id="meses">0</span>
                <p>Meses</p>
            </div>

            <div class="tempo">
                <span id="dias">0</span>
                <p>Dias</p>
            </div>

            <div class="tempo">
                <span id="horas">0</span>
                <p>Horas</p>
            </div>

            <div class="tempo">
                <span id="minutos">0</span>
                <p>Minutos</p>
            </div>

            <div class="tempo">
                <span id="segundos">0</span>
                <p>Segundos</p>
            </div>

        </div>

        <p class="mensagem">
            Cada segundo nos deixa mais perto de celebrar o amor. ❤
        </p>

    </div>
    <script src="script.js"></script>
</body>
</html>
