<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Hoje | Previsão do Tempo</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <div class="marca"><span class="marca-icone">☀</span><span>clima<span class="marca-destaque">hoje</span></span></div>
      <span class="cabecalho-info">PREVISÃO DO TEMPO</span>
    </header>

    <section class="introducao">
      <span class="subtitulo">CONSULTE O TEMPO EM TEMPO REAL</span>
      <h1>Como está o tempo <span>por aí?</span></h1>
      <p>Pesquise uma cidade para conferir o clima atual e os próximos 7 dias.</p>

      <form id="form-busca" class="form-busca">
        <label class="sr-only" for="input">Nome da cidade</label>
        <span class="icone-local" aria-hidden="true">⌖</span>
        <input type="text" id="input" placeholder="Digite o nome da cidade..." required>
        <button id="buscar" type="submit">Buscar cidade →</button>
      </form>

      <div class="sugestoes">
        <span>Buscas rápidas:</span>
        <button type="button" data-cidade="São Paulo">São Paulo</button>
        <button type="button" data-cidade="Rio de Janeiro">Rio de Janeiro</button>
        <button type="button" data-cidade="Curitiba">Curitiba</button>
        <button type="button" data-cidade="Recife">Recife</button>
      </div>
    </section>

    <section id="resultado" class="resultado" aria-live="polite">
      <p class="mensagem">Carregando a previsão...</p>
    </section>

    <footer>Dados meteorológicos fornecidos por Open-Meteo</footer>
  </main>
</body>
</html>
